<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipQuotes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">ClipQuotes</h1>
      <div class="header-actions">
        <button id="btn-export" class="btn btn-sm" title="Export as Markdown">Export</button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search quotes, titles, tags, notes" autocomplete="off">
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state hidden">
      <p>No saved quotes yet</p>
      <p class="empty-hint">Select text on any page → Right-click → "Save Quote"</p>
    </div>

    <!-- List -->
    <div id="list" class="list"></div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
      <span>Loading…</span>
    </div>

    <!-- Error -->
    <div id="error" class="error hidden"></div>
  </div>

  <!-- Edit modal -->
  <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit</h2>
        <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p id="modal-quote" class="modal-quote"></p>
        <div class="form-group">
          <label for="modal-tags">Tags (comma separated)</label>
          <input type="text" id="modal-tags" placeholder="e.g., life, wisdom, inspiration">
        </div>
        <div class="form-group">
          <label for="modal-note">Note</label>
          <textarea id="modal-note" rows="3" placeholder="Add your thoughts…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-delete" class="btn btn-danger">Delete</button>
        <div class="modal-footer-right">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content confirm-content">
      <div class="modal-header">
        <h2>Confirm Delete</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
